name: Verify with Claude Code

# Full lane. Installs ClaudePluginHub's owned and top plugins with the real Claude Code CLI on Linux,
# macOS and Windows, and reports what it did to claudepluginhub.com. Hourly; a plugin is re-checked
# when its commit, its install route or the Claude Code version changed, or its last result was an
# error (see verify.py plan). The jobs live in run.yml; verify-fast.yml is the fast lane.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      slugs:
        description: Comma-separated plugin slugs to check on every OS (default = what changed)
        required: false
        default: ''
      force:
        description: Re-check every target
        type: boolean
        default: false

permissions: {}

concurrency:
  group: cli-verify
  cancel-in-progress: false

jobs:
  run:
    permissions:
      contents: read
    uses: ./.github/workflows/run.yml
    with:
      lane: full
      slugs: ${{ inputs.slugs || '' }}
      force: ${{ inputs.force || false }}
